name: build-and-test
run-name: ${{ github.actor }} pushed commit
on:
  push:
    # Branches only. Tag pushes and releases are handled by release.yml;
    # without this filter a release would trigger this workflow twice over.
    branches:
      - '**'
  workflow_dispatch:

jobs:
  python-tests:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    # 3.14 is exploratory: scikit-fmm publishes no cp314 wheel, so it must
    # build from source there. Let it report without failing the workflow.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        experimental: [false]
        include:
          - python-version: "3.14"
            experimental: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.4.3
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v6
        with:
          path: .venv
          # poetry.lock must be part of the key, otherwise a changed lock
          # restores a stale venv and the install step is skipped.
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction
      - name: Lint project
        run: poetry run black --check . && poetry run isort -c .
      - name: Test project
        run: poetry run pytest .

  build-and-test:
    name: build-and-test
    needs: python-tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix result
        env:
          MATRIX_RESULT: ${{ needs.python-tests.result }}
        run: |
          echo "Python test matrix: $MATRIX_RESULT"
          test "$MATRIX_RESULT" = success
