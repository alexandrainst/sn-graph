name: release
run-name: Release ${{ github.event.release.tag_name }}
on:
  release:
    types:
      - "published"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          # Full history and tags are required: poetry-dynamic-versioning
          # derives the version from the git tag, and a shallow clone would
          # silently produce 0.0.0.
          fetch-depth: 0
      - name: Set up python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.4.3
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Test project
        run: poetry run pytest .
      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Verify the built version matches the release tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ ! -f "dist/sn_graph-${TAG}-py3-none-any.whl" ]; then
            echo "Built artifacts do not match tag ${TAG}:"
            ls -1 dist/
            exit 1
          fi
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Trusted Publishing: PyPI mints a short-lived credential from this
    # workflow's identity, so there is no API token stored in the repository.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
